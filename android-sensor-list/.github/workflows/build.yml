name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's sdkmanager needs its default JDK, so install SDK packages first.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3" > /dev/null
      # This old Android Gradle Plugin only runs on JDK 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build and unit-test
        run: sh ./gradlew --no-daemon assembleDebug testDebugUnitTest
