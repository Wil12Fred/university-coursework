name: mini0-lexer-parser
on:
  push:
    paths: ['mini0-lexer-parser/**', '.github/workflows/mini0-lexer-parser.yml']
  pull_request:
    paths: ['mini0-lexer-parser/**', '.github/workflows/mini0-lexer-parser.yml']

defaults:
  run:
    working-directory: mini0-lexer-parser

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valid program is accepted
        run: python anLx.py examples/valid.txt | grep -q "Analisis sintactico correcto"
      - name: Invalid program is rejected
        run: python anLx.py examples/error.txt | grep -q "ERROR"
