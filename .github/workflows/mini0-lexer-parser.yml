name: mini0-lexer-parser
on:
  push:
    paths: ['mini0-lexer-parser/**', '.github/workflows/mini0-lexer-parser.yml']
  pull_request:
    paths: ['mini0-lexer-parser/**', '.github/workflows/mini0-lexer-parser.yml']

defaults:
  run:
    working-directory: mini0-lexer-parser

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest (lexer, parser, golden programs, documented limits)
        run: uv run --locked pytest -v
