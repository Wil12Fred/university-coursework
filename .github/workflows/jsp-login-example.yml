name: jsp-login-example

on:
  push:
    paths: ['jsp-login-example/**', '.github/workflows/jsp-login-example.yml']
  pull_request:
    paths: ['jsp-login-example/**', '.github/workflows/jsp-login-example.yml']

defaults:
  run:
    working-directory: jsp-login-example

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Fetch servlet API
        run: curl -sSfL -o servlet-api.jar https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/3.1.0/javax.servlet-api-3.1.0.jar
      - name: Build WAR
        run: SERVLET_API_JAR=$PWD/servlet-api.jar ./build.sh
