name: jsp-login-example

on:
  push:
    paths: ['jsp-login-example/**', '.github/workflows/jsp-login-example.yml']
  pull_request:
    paths: ['jsp-login-example/**', '.github/workflows/jsp-login-example.yml']

defaults:
  run:
    working-directory: jsp-login-example

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests (H2 in memory) and WAR
        run: ./mvnw -B package
      - run: unzip -l target/LoginPageJsp.war
