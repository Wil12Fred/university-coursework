name: parallel-algorithms
on:
  push:
    paths: ['parallel-algorithms/**', '.github/workflows/parallel-algorithms.yml']
  pull_request:
    paths: ['parallel-algorithms/**', '.github/workflows/parallel-algorithms.yml']

defaults:
  run:
    working-directory: parallel-algorithms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: make -j4
      - name: Pthreads tests
        run: make test
      - name: Build the MPI programs
        run: make mpi build/oddeven_test
      - name: MPI tests (mpirun --oversubscribe)
        run: make test-mpi
