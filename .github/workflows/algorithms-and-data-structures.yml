name: algorithms-and-data-structures
on:
  push:
    paths: ['algorithms-and-data-structures/**', '.github/workflows/algorithms-and-data-structures.yml']
  pull_request:
    paths: ['algorithms-and-data-structures/**', '.github/workflows/algorithms-and-data-structures.yml']

defaults:
  run:
    working-directory: algorithms-and-data-structures

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - run: make -j4
      - name: Unit and golden tests
        run: make test
      - name: Smoke-run the benchmarks (timings vary; check they finish)
        run: |
          build/Heap-main | wc -l | grep -qx 6
          build/Quick-main_ | wc -l | grep -qx 6
          build/Merge-main_ | wc -l | grep -qx 6
          build/RedBlack-main
