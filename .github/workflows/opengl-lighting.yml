name: opengl-lighting
on:
  push:
    paths: ['opengl-lighting/**', '.github/workflows/opengl-lighting.yml']
  pull_request:
    paths: ['opengl-lighting/**', '.github/workflows/opengl-lighting.yml']

defaults:
  run:
    working-directory: opengl-lighting

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev xvfb libgl1-mesa-dri
      - run: make
      - name: Unit tests and a headless run under Xvfb
        run: make test
