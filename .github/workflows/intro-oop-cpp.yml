name: intro-oop-cpp
on:
  push:
    paths: ['intro-oop-cpp/**', '.github/workflows/intro-oop-cpp.yml']
  pull_request:
    paths: ['intro-oop-cpp/**', '.github/workflows/intro-oop-cpp.yml']

defaults:
  run:
    working-directory: intro-oop-cpp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Golden tests
        run: make test
